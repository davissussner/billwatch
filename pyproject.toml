[project]
name = "congress-summarizer"
version = "0.1.0"
description = "Monthly plain-English briefs on the bills that actually moved in Congress"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.4.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "lxml>=5.0",
    "python-dotenv>=1.0",
]

[project.scripts]
ingest = "congress_summarizer.ingest:main"
rank = "congress_summarizer.rank:main"
fetch-text = "congress_summarizer.text:main"
summarize = "congress_summarizer.summarize:main"
build-site = "congress_summarizer.build_site:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/congress_summarizer"]
